current_summary: >-
  Halpha 当前代码和非秘密配置已把原先单一 Live 目标拆为三个固定交易上下文：Demo、带单员公域合约实盘和个人合约实盘。
  三者复用同一计划、资金、执行和复盘逻辑，但分别绑定账户类型、环境与账户标识、数据库、App/Executor 身份、
  Windows 任务、凭据命名空间、写执行互斥、写门文件、监听端口和角色输出；工作台通过一个原子交易上下文选择器切换。
  三个上下文的数据库、身份、任务和 App 已在当前主机部署；Demo Executor 持续运行，带单 Read Only Executor 使用精确绑定的
  带单账户只读 API Key 每 30 秒追加一份完整账户事实，个人 Read Only Executor 因尚无私有账户凭据保持禁用。
  带单账户页面分别显示当前仓位和当前委托，不展示过期事实为当前数据。全部真实账户写门保持关闭，Halpha 不允许交易所变更请求。

current_product_boundary:
  outcome: >-
    支持计划配置与固定、一次激活、持续监控、交易所动作执行、保护、退出、核对、复盘和用户接管。
  includes:
    - DEMO 完整闭环
    - LIVE_READ_ONLY 公开行情观察
    - LIVE_WRITE（真实账户交易）的无凭据实现、安全反例和一次受限真实激活能力
    - Demo、带单员公域合约账户和个人合约账户三个固定且互相隔离的交易上下文
    - 本地交易工作台、Windows 运行、邮件通知、备份恢复和官方入口接管
  excludes:
    - 第二个正式策略
    - 任意动态账户接入、跨账户组合视图、资金分配、组合优化和凭据自动发现或回退
    - 多场所接入
    - 独立 Research 与 Monitor 仓库的实现、依赖、数据和生命周期
    - 自动扩大资金范围
    - 高可用、微服务、机构审批或治理平台

current_decisions:
  target_host: Windows 10 Pro 22H2 x64
  host_rule: 不迁移、不缩减目标；如实记录依赖支持限制，并以本机直接验证判断当前可用性
  development_flow: CONTINUOUS_SMALL_ITERATIONS
  iteration_rule: 每次围绕一个可验证的小结果完成必要设计、实现、验证和修复，验证通过后直接集成
  capital_authority: 半自动计划中用户配置并固定的交易金额就是本次资金边界；激活只让计划开始运行
  build_identity: 每组产品输入只使用一个 product_build_id
  observation: 只有当前发布、部署或真实资金决定提出直接测试无法回答的问题时才增加观察
  research: >-
    AI 可在独立研究边界内，基于项目当前问题、既有证据和外部调研自主选择一个有价值的可证伪问题；
    问题与取舍理由由对应研究材料记录，结果仍须由项目所有者决定是否进入产品。

