    build: 10.0.19045
    architecture: x64
    dependency_caveat: >-
      当前 NautilusTrader 版本的常规 Windows 支持边界不包含该主机；项目记录此限制，
      通过本机安装、启停、重启和联合链路验证判断当前可用性，不表述为供应商保证。
  trading:
    venue: Binance USDⓈ-M
    demo_instruments: [BTCUSDT-PERP, ETHUSDT-PERP]
    first_live_instrument: BTCUSDT-PERP
    strategy: ONE_SHOT_DONCHIAN_ATR_BREAKOUT
    account_configuration_mutation: DISABLED
  topology:
    database: PostgreSQL
    configuration_schema_version: 2
    processes: [halpha-app, halpha-executor]
    configured_contexts:
      demo:
        environment_kind: DEMO
        venue_account_type: USDM_DEMO
        environment_id: binance-demo-primary
        account_id: binance-usdm-demo-owner-primary
        supported_profiles: [BINANCE_DEMO]
        database: halpha_demo
        app_port: 8765
        credential_namespace: BINANCE_DEMO
        windows_tasks: ['\Halpha\App.BINANCE_DEMO', '\Halpha\Executor.BINANCE_DEMO']
        windows_identities:
          app: HalphaAppDemo
          executor: HalphaExecutorDemo
        database_roles:
          app: halpha_demo_app
          executor: halpha_demo_executor
          migration: halpha_demo_migration
          backup: halpha_demo_backup
        write_gate: NOT_APPLICABLE
      live_copy:
        environment_kind: LIVE
        venue_account_type: USDM_COPY_LEAD
        environment_id: binance-live-copy-primary
        account_id: binance-usdm-copy-lead-primary
        supported_profiles: [BINANCE_LIVE_READ_ONLY, BINANCE_LIVE_WRITE]
