        app_port: 8766
        credential_namespace: BINANCE_LIVE_COPY
        windows_tasks: ['\Halpha\App.BINANCE_LIVE_COPY', '\Halpha\Executor.BINANCE_LIVE_COPY']
        windows_identities:
          app: HalphaAppCopy
          executor: HalphaExecCopy
        database_roles:
          app: halpha_live_copy_app
          app_reader: halpha_live_copy_app_reader
          executor: halpha_live_copy_executor
          migration: halpha_live_copy_migration
          backup: halpha_live_copy_backup
        write_gate: state/live-copy-write-gate.json
      live_personal:
        environment_kind: LIVE
        venue_account_type: USDM_PERSONAL
        environment_id: binance-live-personal-primary
        account_id: binance-usdm-personal-primary
        supported_profiles: [BINANCE_LIVE_READ_ONLY, BINANCE_LIVE_WRITE]
        database: halpha_live_personal
        app_port: 8767
        credential_namespace: BINANCE_LIVE_PERSONAL
        windows_tasks: ['\Halpha\App.BINANCE_LIVE_PERSONAL', '\Halpha\Executor.BINANCE_LIVE_PERSONAL']
        windows_identities:
          app: HalphaAppPersonal
          executor: HalphaExecPersonal
        database_roles:
          app: halpha_live_personal_app
          app_reader: halpha_live_personal_app_reader
          executor: halpha_live_personal_executor
          migration: halpha_live_personal_migration
          backup: halpha_live_personal_backup
        write_gate: state/live-personal-write-gate.json
    product_credential_boundary:
      demo_app: 只投影 Demo App 的数据库、Web 与通知凭据
      demo_executor: 只投影 Demo Executor 的数据库、Demo API Key 与运行网络凭据
      live_copy_read_only_app: 只投影带单上下文 App 的数据库、Web 与通知凭据；数据库连接强制只读
      live_copy_read_only_executor: 只投影带单上下文 Executor 的数据库、只读 API Key 与运行网络凭据；只允许 DAT 账户事实追加
      live_copy_write_executor: 只允许读取 BINANCE_LIVE_COPY 下精确绑定的带单账户凭据
      live_personal_read_only_app: 只投影个人上下文 App 的数据库、Web 与通知凭据；数据库连接强制只读
      live_personal_write_executor: 只允许读取 BINANCE_LIVE_PERSONAL 下精确绑定的个人账户凭据
      live_personal_read_only_executor: 任务禁用，不投影个人账户 API Key
      cross_context_or_role_fallback: false
    venue_account_qualification:
      applies_to: BINANCE_LIVE_WRITE_NORMAL_RISK_INCREASE_ONLY
      credential_binding: 使用写门 SHA-256 指纹已绑定的同一 API Key
      lead_status_endpoint: GET https://api.binance.com/sapi/v1/copyTrading/futures/userStatus
      lead_symbol_endpoint: GET https://api.binance.com/sapi/v1/copyTrading/futures/leadSymbol
      live_copy_requirement: isLeadTrader=true，且产品目标 symbol 全部位于当前带单白名单
      live_personal_requirement: isLeadTrader=false，不请求带单 symbol 白名单
      request_contract: 签名 GET、禁止重定向、3 秒超时、响应上限 64 KiB、错误内容不透传
      freshness: 成功事实最多缓存 60 秒；启动和后续增险写门复核时按需刷新
      failure_effect: Executor 拒绝正常写启动或后续增险；既有激活只恢复路径不因此失去撤单、保护、减仓和退出能力
    role_output_directories:
      demo_app: logs/binance-demo-primary/app
      demo_executor: logs/binance-demo-primary/executor
      live_copy_app: logs/binance-live-copy-primary/app
      live_copy_executor: logs/binance-live-copy-primary/executor
      live_personal_app: logs/binance-live-personal-primary/app
      live_personal_executor: logs/binance-live-personal-primary/executor
      shared_backup_log: logs/maintenance/backup
    shared_auxiliary:
      backup:
        task: '\Halpha\Backup'
        identity: HalphaBackup
        database_role_source: target_runtime.topology.configured_contexts 的三个独立 backup 角色
        output_directories:
          demo: backups/postgresql/demo
          live_copy: backups/postgresql/live_copy
          live_personal: backups/postgresql/live_personal
        product_database_write: false
        exchange_change_requests: false
        api_key_access: false
    lifecycle_control_cli: halpha-control
    lifecycle_default_config: config/halpha.toml
    lifecycle_generated_output_language: ASCII_ENGLISH
    lifecycle_pass_through_text: SOURCE_PRESERVED
    lifecycle_inventory_scope: 当前仓库及所有已登记 Git 工作树中的产品进程树、TCP 监听和 Windows Halpha 任务
    product_start_group:
      demo: [app, executor]
      live_copy_read_only: [app, executor]
      live_personal_read_only: [app]
    live_read_only_executor_tasks:
      live_copy: CONTINUOUS_PRIVATE_ACCOUNT_OBSERVATION
      live_personal: DISABLED_EXPLICIT_OBSERVATION_SESSION_ONLY
    auxiliary_start_rule: backup 只能显式单独启动，不随 product 启动
    direct_product_long_running_start: PROHIBITED
    exchange_change_paths_per_context: 1
    web:
      demo: 127.0.0.1:8765
      live_copy: 127.0.0.1:8766
      live_personal: 127.0.0.1:8767
    notification: EMAIL_ONLY
    filesystem_boundary: 固定产品输入只读；三个上下文、App/Executor 与共享 Backup 的目标可写目录互相隔离；当前任务已据此运行，但三上下文完整 ACL 资格报告尚未重新记录
    deployment_status:
      observed_at: 2026-08-03
      demo: App 与 Executor 由独立 Windows 任务运行
      live_copy_target: App 与只读账户观察 Executor 由独立 Windows 任务运行；Executor 不装载执行客户端或动作能力
      live_personal_target: App 由独立 Windows 任务运行；Executor 因没有个人账户私有凭据保持禁用
      shared_auxiliary: Backup 就绪

